name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build and verify distribution artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python -c '
          import os
          from pathlib import Path
          import sys
          import tomllib

          release_tag = os.environ.get("RELEASE_TAG", "").strip()
          if not release_tag:
              print("Error: RELEASE_TAG environment variable is empty.", file=sys.stderr)
              sys.exit(1)

          with Path("pyproject.toml").open("rb") as f:
              pyproject = tomllib.load(f)

          pkg_version = pyproject.get("project", {}).get("version")
          if not pkg_version:
              print("Error: [project].version not found in pyproject.toml.", file=sys.stderr)
              sys.exit(1)

          expected_tag = f"v{pkg_version}"
          if release_tag != expected_tag:
              print(
                  f"Error: Release tag \"{release_tag}\" does not match package version \"{pkg_version}\" "
                  f"(expected tag \"{expected_tag}\").",
                  file=sys.stderr,
              )
              sys.exit(1)

          print(f"Version check passed: release tag \"{release_tag}\" matches pyproject.toml version \"{pkg_version}\".")
          '

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project and development tools
        run: |
          pip install -e .
          pip install --group dev

      - name: Run Ruff lint
        run: ruff check .

      - name: Check Ruff formatting
        run: ruff format --check .

      - name: Run tests
        run: pytest

      - name: Build package distributions
        run: python -m build

      - name: Verify distribution artifacts and build from sdist
        run: python scripts/verify_distribution.py

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish package to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project and development tools
        run: |
          pip install -e .
          pip install --group dev

      - name: Run Ruff lint
        run: ruff check .

      - name: Check Ruff formatting
        run: ruff format --check .

      - name: Run tests
        run: pytest

      - name: Build package
        run: python -m build

      - name: Verify distribution artifacts and build from sdist
        run: python scripts/verify_distribution.py

      - name: Verify built wheel installation and data resources
        run: |
          WHEEL_PATH=$(ls dist/*.whl | head -n 1)
          pip install --force-reinstall --no-deps "$WHEEL_PATH"
          cd "$RUNNER_TEMP"
          python -c '
          import importlib.resources as importlib_resources
          from pcge import load_catalog

          catalog = load_catalog("2026")
          assert len(catalog) == 1636, f"Expected 1636 entries, got {len(catalog)}"
          assert catalog.metadata is not None, "Metadata must not be None"
          assert catalog.metadata.pcge_version == "2026", f"Expected version 2026, got {catalog.metadata.pcge_version}"
          assert "10" in catalog, "Representative entry 10 must exist"
          assert catalog["10"].name == "EFECTIVO Y EQUIVALENTES AL EFECTIVO", "Representative entry 10 name mismatch"
          assert importlib_resources.files("pcge").joinpath("py.typed").is_file(), "py.typed must be installed in package"
          print("Wheel verification succeeded: catalog loaded with 1636 entries from external directory.")
          '

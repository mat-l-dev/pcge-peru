name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Check development tool version consistency
        run: python scripts/check_tool_versions.py

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project and development tools
        run: |
          pip install -e .
          pip install --group dev

      - name: Run Ruff lint
        run: ruff check .

      - name: Check Ruff formatting
        run: ruff format --check .

      - name: Run tests
        run: pytest

      - name: Build package
        run: python -m build

      - name: Verify distribution artifacts and build from sdist
        run: python scripts/verify_distribution.py

      - name: Upload verified distribution artifacts
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  verify-artifact:
    name: Verify downloaded distribution artifacts
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Download verified distribution artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Verify downloaded artifacts and isolated wheel installation
        run: python scripts/verify_distribution.py --skip-sdist-rebuild

  ci-passed:
    name: CI passed
    needs: [test, verify-artifact]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all validation jobs to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          results = json.loads(os.environ["NEEDS_JSON"])
          failures = {
              name: job["result"]
              for name, job in results.items()
              if job["result"] != "success"
          }
          if failures:
              print(f"CI validation did not succeed: {failures}", file=sys.stderr)
              sys.exit(1)
          print("All CI validation jobs succeeded.")
          PY

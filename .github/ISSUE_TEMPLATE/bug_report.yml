name: Bug report
description: Reporta un problema con la librería
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Gracias por reportar un problema.

  - type: textarea
    id: description
    attributes:
      label: Descripción del problema
      description: Explica claramente qué está ocurriendo.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportamiento esperado
      description: ¿Qué esperabas que ocurriera?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Pasos para reproducir
      description: Indica cómo podemos reproducir el problema.
      placeholder: |
        1. Instalar...
        2. Ejecutar...
        3. Observar...
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Versión de Python
      placeholder: "3.14.x"
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Información adicional
      description: Logs, capturas o cualquier otro dato relevante.